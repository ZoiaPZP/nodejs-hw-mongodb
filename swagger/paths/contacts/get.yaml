tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
    description: Page number for pagination
  - name: perPage
    in: query
    schema:
      type: integer
    description: Number of contacts per page
  - name: type
    in: query
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
  - name: isFavourite
    in: query
    schema:
      type: boolean
    description: Filter by favorite status
  - name: sortBy
    in: query
    schema:
      type: string
      example: name,email
    description: Fields for sorting, separated by commas
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sorting direction (asc or desc)
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 42
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '400':
    description: Invalid query parameters
